name: pnlx

services:
  mongo:
    image: mongo:7
    container_name: pnlx-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - pnlx-private
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: local/pnlx-app:2058a2d
    container_name: pnlx-api
    restart: unless-stopped
    init: true
    env_file:
      - /opt/pnlx/.env
    ports:
      - 127.0.0.1:4000:4000
    environment:
      NODE_ENV: production
      PNLX_API_HOST: 0.0.0.0
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/pnlx_fees_20260924
      MONGODB_DATABASE: pnlx_fees_20260924
      MONGODB_PROTOCOL_COLLECTION: protocol_state
      MATCHER_SERVICE_URL: http://matcher:4103
      PNLX_PROVER_URL: http://prover:4101
      PNLX_PROVER_BACKEND: runpod
      PNLX_RISC0_WRAP_SOCKET: /run/pnlx-risc0-wrap/prover.sock
      BATCH_EXECUTOR_ENABLED: "true"
      FUNDING_ENGINE_ENABLED: "false"
      FUNDING_IMPACT_MARGIN: "5000000000"
      FUNDING_MINIMUM_SAMPLES: "10"
      FUNDING_PREMIUM_MODE: impact-twap
      FUNDING_PREMIUM_RATE_CAP: "5000"
      FUNDING_SAMPLE_INTERVAL_MS: "60000"
      LIQUIDATION_AUTOMATION_ENABLED: "true"
      PROTOCOL_ADMIN_REQUIRED: "true"
    depends_on:
      mongo:
        condition: service_healthy
      matcher:
        condition: service_started
      prover:
        condition: service_started
    networks:
      pnlx-private:
      pnlx-edge:
        aliases:
          - pnlx-api
    volumes:
      - app-state:/app/.pnlx
      - /run/pnlx-risc0-wrap:/run/pnlx-risc0-wrap
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    cpus: 1.0

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    container_name: pnlx-cloudflared
    restart: unless-stopped
    user: "65532:65532"
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/etc/cloudflared/token"]
    network_mode: host
    volumes:
      - /opt/pnlx/cloudflared/token:/etc/cloudflared/token:ro
    depends_on:
      api:
        condition: service_healthy

  matcher:
    image: local/pnlx-app:2058a2d
    container_name: pnlx-matcher
    restart: unless-stopped
    init: true
    env_file:
      - /opt/pnlx/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/pnlx_fees_20260924
      MONGODB_DATABASE: pnlx_fees_20260924
      MONGODB_PROTOCOL_COLLECTION: protocol_state
      MATCHER_SERVICE_URL: ""
      MATCHER_HOST: 0.0.0.0
      MATCHER_PORT: "4103"
      PRIVATE_MATCHING_REQUIRED: "true"
      PNLX_PROVER_BACKEND: runpod
      PNLX_RISC0_WRAP_SOCKET: /run/pnlx-risc0-wrap/prover.sock
      BATCH_EXECUTOR_ENABLED: "true"
      PROTOCOL_ADMIN_REQUIRED: "true"
    command: ["bun", "server/src/matcher-server.ts"]
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - pnlx-private
    volumes:
      - app-state:/app/.pnlx
      - /run/pnlx-risc0-wrap:/run/pnlx-risc0-wrap
    mem_limit: 1g
    cpus: 1.0

  prover:
    image: local/pnlx-app:2058a2d
    container_name: pnlx-prover
    restart: unless-stopped
    init: true
    env_file:
      - /opt/pnlx/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/pnlx_fees_20260924
      MONGODB_DATABASE: pnlx_fees_20260924
      MONGODB_PROTOCOL_COLLECTION: protocol_state
      PNLX_CLIENT_PROVER_HOST: 0.0.0.0
      PNLX_CLIENT_PROVER_PORT: "4101"
    command: ["bun", "run", "prover:client"]
    volumes:
      - /opt/pnlx/tools/.nargo:/root/.nargo:ro
      - /opt/pnlx/tools/.bb:/root/.bb:ro
      - app-state:/app/.pnlx
    networks:
      - pnlx-private
    mem_limit: 3g
    cpus: 2.0

  vault-maker:
    image: local/pnlx-app:2058a2d
    container_name: pnlx-vault-maker
    restart: unless-stopped
    init: true
    profiles:
      - live-worker
    env_file:
      - /opt/pnlx/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/pnlx_fees_20260924
      MONGODB_DATABASE: pnlx_fees_20260924
      MONGODB_PROTOCOL_COLLECTION: protocol_state
    command:
      - bun
      - scripts/operations/manage-vault-maker-liquidity.ts
      - --ready-usdc
      - "1000"
      - --operator-source
      - pnlx-maker
      - --maker-source
      - pnlx-maker
      - --api-url
      - http://api:4000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pnlx-private
    mem_limit: 512m
    cpus: 0.5

networks:
  pnlx-private:
    name: pnlx-private
  pnlx-edge:
    name: pnlx-edge
    external: true

volumes:
  mongo-data:
    name: pnlx-mongo-data
  app-state:
    name: pnlx-app-state

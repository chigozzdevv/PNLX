[package]
name = "pnlx-risc0-batch-match-prover"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
alloy = { version = "1.0.34", default-features = false, features = ["signer-local"] }
anyhow.workspace = true
aws-config = { version = "1.6", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1.34", default-features = false, features = ["default-https-client", "rt-tokio"] }
boundless-market = { version = "2.0.1", default-features = false, features = ["s3"] }
clap = { version = "4.5", features = ["derive", "env", "string"] }
hex.workspace = true
pnlx-risc0-batch-match-core = { path = "../core" }
pnlx-risc0-methods = { path = "../methods" }
risc0-zkvm = { workspace = true, features = ["client", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

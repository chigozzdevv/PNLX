name: RunPod handler

on:
  pull_request:
    paths:
      - .github/workflows/runpod-handler.yml
      - .github/workflows/runpod-handler-release.yml
      - deploy/runpod/handler.py
      - deploy/runpod/tests/**
      - deploy/runpod-handler/Dockerfile
      - server/src/workers/risc0-matcher/runpod-diagnostics.ts
      - server/src/workers/risc0-matcher/runpod-diagnostics.test.ts
  push:
    branches:
      - main
    paths:
      - .github/workflows/runpod-handler.yml
      - .github/workflows/runpod-handler-release.yml
      - deploy/runpod/handler.py
      - deploy/runpod/tests/**
      - deploy/runpod-handler/Dockerfile
      - server/src/workers/risc0-matcher/runpod-diagnostics.ts
      - server/src/workers/risc0-matcher/runpod-diagnostics.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handler:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Run handler checks
        run: python3 -m unittest discover -s deploy/runpod/tests -p 'test_*.py' -v

      - name: Run RunPod diagnostic checks
        run: bun test server/src/workers/risc0-matcher/runpod-diagnostics.test.ts

name: Publish RunPod handler

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/chigozzdevv/pnlx-runpod-worker
  BASE_IMAGE: ghcr.io/chigozzdevv/pnlx-runpod-worker:sha-aba4bf358152ea08dae5870aa3b39d875a88c75c

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and publish handler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workloads/runpod-handler/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}
          tags: ${{ env.IMAGE_NAME }}:handler-sha-${{ github.sha }}

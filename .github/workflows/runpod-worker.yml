name: Publish RunPod worker

on:
  push:
    branches:
      - main
    paths:
      - deploy/runpod/**
      - risc0/batch-match/**
      - '!deploy/runpod/handler.py'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-worker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/chigozzdevv/pnlx-runpod-worker
  RUST_VERSION: 1.93.0
  RZUP_VERSION: 0.5.1
  RISC0_RUST_VERSION: 1.94.1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install RISC Zero Rust toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo install rzup --version "${RZUP_VERSION}" --locked
          for attempt in 1 2 3; do
            if rzup install rust "${RISC0_RUST_VERSION}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Cache RISC Zero build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: risc0/batch-match -> target

      - name: Build batch guest
        run: >-
          cargo build
          --manifest-path risc0/batch-match/Cargo.toml
          --workspace
          --release
          --locked

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.9
  NOIR_VERSION: 1.0.0-beta.9
  BB_VERSION: 0.87.0
  RUST_VERSION: 1.93.0

jobs:
  application:
    name: Server, packages and client
    needs: circuits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      MONGODB_URI: mongodb://127.0.0.1:27017/pnlx_test
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
      RUSTUP_TOOLCHAIN: 1.93.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download verifier test proof
        uses: actions/download-artifact@v8
        with:
          name: withdraw-verifier-proof
          path: circuits/withdraw/target/bb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v27.0.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JavaScript dependencies
        run: bun ci

      - name: Install Noir
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://raw.githubusercontent.com/noir-lang/noirup/refs/heads/main/install | bash
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          "$HOME/.nargo/bin/noirup" --version "$NOIR_VERSION"

      - name: Install Barretenberg
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
          echo "$HOME/.bb" >> "$GITHUB_PATH"
          echo "$HOME/.bb/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bb:$HOME/.bb/bin:$PATH"
          bbup -v "$BB_VERSION"

      - name: Verify application toolchains
        run: |
          bun --version
          nargo --version
          bb --version
          stellar --version

      - name: Run package tests
        run: bun run test:packages

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Run client tests
        run: bun run test:client

      - name: Check client types and lint
        run: bun run client:check

      - name: Build client
        run: bun run client:build

  contracts:
    name: Rust and Soroban contracts
    needs: circuits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download verifier test proof
        uses: actions/download-artifact@v8
        with:
          name: withdraw-verifier-proof
          path: circuits/withdraw/target/bb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target

      - name: Run contract tests
        run: cargo test --manifest-path contracts/Cargo.toml --locked

      - name: Build Soroban contracts
        run: >-
          cargo build
          --manifest-path contracts/Cargo.toml
          --locked
          --release
          --target wasm32v1-none

  circuits:
    name: Noir circuits
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JavaScript dependencies
        run: bun ci

      - name: Install Noir
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://raw.githubusercontent.com/noir-lang/noirup/refs/heads/main/install | bash
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          "$HOME/.nargo/bin/noirup" --version "$NOIR_VERSION"

      - name: Install Barretenberg
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
          echo "$HOME/.bb" >> "$GITHUB_PATH"
          echo "$HOME/.bb/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bb:$HOME/.bb/bin:$PATH"
          bbup -v "$BB_VERSION"

      - name: Verify circuit toolchains
        run: |
          bun --version
          nargo --version
          bb --version

      - name: Test every circuit
        run: bash scripts/ci/test-noir.sh

      - name: Build verifier test proof
        run: bun scripts/proof/build.ts withdraw

      - name: Upload verifier test proof
        uses: actions/upload-artifact@v7
        with:
          name: withdraw-verifier-proof
          path: |
            circuits/withdraw/target/bb/vk
            circuits/withdraw/target/bb/proof
            circuits/withdraw/target/bb/public_inputs
          if-no-files-found: error
          retention-days: 1
